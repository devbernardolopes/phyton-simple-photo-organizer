# Gera OrganizadorDeFotos.exe para Windows (sem exigir Python na máquina do sogro).
#
# Como funciona:
# - A cada push na branch main e a cada tag v*, compila no windows-latest.
# - O .exe fica disponível em Actions > Artifacts (por 90 dias).
# - Em tags v* (ex.: v1.0.0), cria também uma Release com o .exe + LEIA-ME anexados.
#
# Para liberar uma versão ao sogro:
#   git tag v1.0.0
#   git push origin v1.0.0
#   -> aba Releases do GitHub, baixe OrganizadorDeFotos-Windows.zip

name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (compatível com Win10/11 + Tkinter)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .exe with PyInstaller
        run: pyinstaller --onefile --windowed --name OrganizadorDeFotos organizador_fotos.py --clean

      - name: Prepare zip for father-in-law
        shell: pwsh
        run: |
          Copy-Item "dist/OrganizadorDeFotos.exe" -Destination "OrganizadorDeFotos.exe"
          Copy-Item "LEIA-ME.txt" -Destination "LEIA-ME.txt" -ErrorAction SilentlyContinue
          Compress-Archive -Path "OrganizadorDeFotos.exe", "LEIA-ME.txt" -DestinationPath "OrganizadorDeFotos-Windows.zip" -Force
          Get-ChildItem dist/, OrganizadorDeFotos-Windows.zip

      - name: Upload artifact (.exe + zip)
        uses: actions/upload-artifact@v4
        with:
          name: OrganizadorDeFotos-Windows
          path: |
            dist/OrganizadorDeFotos.exe
            OrganizadorDeFotos-Windows.zip
          retention-days: 90

      - name: Publish GitHub Release (only on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OrganizadorDeFotos.exe
            OrganizadorDeFotos-Windows.zip
          generate_release_notes: true
